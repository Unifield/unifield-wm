  Create FUNDING POOL FP1
-
 !record {model: account.analytic.account, id: test_0110_fp1, db: hq1}:
   instance_id: "@search;msf.instance;('code','=','vg-sp-208_HQ1C1')"
   code: FP1
   name: FP1
   date_start: 2015-01-01
   cost_center_ids: [ "@search;account.analytic.account;('code','=','HT101'),('type','=','normal'),('category','=','OC')", test_0110_cc_ht120 ]

   # Not editable values
   state: open
   type: normal
   category: FUNDING
   parent_id: "@search;account.analytic.account;('code','=','FUNDING'),('type','=','view'),('category','=','FUNDING')"
