  Create FINANCING CONTRACT DONOR
-
 !record {model: financing.contract.donor, id: test_0110_donor, db: hq1}:
   code: DONOR
   name: DONOR
   reporting_currency: sd.base_EUR
-
  Create FINANCING CONTRACT FC1
-
 !record {model: financing.contract.contract, id: test_0110_fc1, db: hq1}:
   code: FC1
   name: FC1
   donor_id: test_0110_donor
   instance_id: "@search;msf.instance;('code','=','vg-sp-208_HQ1C1')"
   eligibility_from_date: 2015-01-01
   eligibility_to_date: 2016-12-31
   grant_amount: 0
   state: open
   cost_center_ids: "@search;account.analytic.account;('code','in',('HT101', 'HT120')),('type','=','normal'),('category','=','OC')"
   funding_pool_ids:
     - funding_pool_id: test_0110_fp1
       funded: True
       total_project: True
     - funding_pool_id: test_0110_fp2
       funded: True
       total_project: True
