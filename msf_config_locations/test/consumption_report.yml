    line_obj = self.pool.get('real.average.consumption.line')
    cu1_id = self.pool.get('stock.location').search(cr, uid, [('name', '=', 'internal CU 1')])[0]
    activity_id = self.pool.get('stock.location').search(cr, uid, [('usage', '=', 'customer')])[0]
    report_id = self.create(cr, uid, {'period_from': '2013-07-21',
                                      'period_to': '2013-07-31',
                                      'activity_id': activity_id,
                                      'cons_location_id': cu1_id})

    # Try to create lines
    try:
        line_obj.create(cr, uid, {'product_id': ref('productA'),
                                  'product_uom': ref('product.product_uom_unit'),
                                  'rac_id': report_id,
                                  'consumed_qty': 5.00})
        line_obj.create(cr, uid, {'product_id': ref('productBN'),
                                  'product_uom': ref('product.product_uom_unit'),
                                  'rac_id': report_id,
                                  'consumed_qty': 5.00})
        line_obj.create(cr, uid, {'product_id': ref('productED'),
                                  'product_uom': ref('product.product_uom_unit'),
                                  'rac_id': report_id,
                                  'consumed_qty': 5.00})
